<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ElektroSys — imagem social</title>
<style>
  @font-face { font-family:'Barlow Semi Condensed'; font-weight:700; font-style:normal;
    src:url('../assets/fonts/barlow-semi-condensed-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:400; font-style:normal;
    src:url('../assets/fonts/inter-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family:'IBM Plex Mono'; font-weight:500; font-style:normal;
    src:url('../assets/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:#0A1B2E;
    color:#E8F0F8;
    font-family:'Inter', system-ui, sans-serif;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:64px 72px;
    position:relative;
  }
  /* malha técnica discreta, igual à do hero */
  .grid {
    position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(44,123,229,.09) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(44,123,229,.09) 1px, transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image: radial-gradient(115% 90% at 85% 8%, #000 0%, transparent 70%);
            mask-image: radial-gradient(115% 90% at 85% 8%, #000 0%, transparent 70%);
  }
  .top, .bottom { position:relative; }
  .plate { display:inline-flex; background:#F7F9FB; border-radius:4px; padding:12px 18px; }
  .plate img { width:264px; height:auto; display:block; }

  h1 {
    font-family:'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif;
    font-weight:700; font-size:72px; line-height:1.0; letter-spacing:-.02em;
    max-width:16ch; margin-top:40px;
  }
  .sub { font-size:22px; line-height:1.5; color:#8CA3BC; max-width:48ch; margin-top:18px; }

  .bottom {
    display:flex; align-items:center; justify-content:space-between; gap:32px;
    border-top:1px solid #21425F; padding-top:24px;
  }
  .sig {
    font-family:'IBM Plex Mono', ui-monospace, monospace; font-weight:500;
    font-size:19px; letter-spacing:.06em; color:#E8F0F8;
  }
  .wa {
    font-family:'IBM Plex Mono', ui-monospace, monospace; font-weight:500;
    font-size:19px; letter-spacing:.06em; color:#25D366;
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="top">
    <span class="plate"><img src="../assets/brand/elektrosys-logo-tight.png" alt="ElektroSys Engenharia Elétrica" width="538" height="239"></span>
    <h1>Projetos, laudos e perícias elétricas.</h1>
    <p class="sub">Baixa e média tensão, SPDA, fotovoltaico e assistência técnica — com atendimento direto do engenheiro responsável.</p>
  </div>

  <div class="bottom">
    <span class="sig">Eng. Gusttavo Gutierry · CREA 1023983184D-GO</span>
    <span class="wa">+55 64 98439-5286</span>
  </div>
</body>
</html>
